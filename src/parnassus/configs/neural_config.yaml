dataset:
  file_path: ""
  num_events: 1000
  entry_start: 0

generator:
  type: "neural" # Generator type: "neural" or "parametric"
  name: "cms_2011_flow_v00"
  num_steps: 50 # Neural-specific: override default sampler steps
  batch_size: 2000 # Shared: batch size for processing
  device: "cpu" # Shared: device for computation (cpu/cuda/mps)

pipelines:
  TruthJetsAntiKt05:
    type: "cluster"
    collection: truth
    dr: 0.5
    algorithm: antikt
    pt_min: 10
    nconst_min: 2
  TruthJetsAntiKt08:
    type: "cluster"
    collection: truth
    dr: 0.8
    algorithm: antikt
    pt_min: 10
    nconst_min: 2
  PflowJetsAntiKt05:
    type: "cluster"
    collection: pflow
    dr: 0.5
    algorithm: antikt
    pt_min: 10
    nconst_min: 2
  ElectronIsolation:
    type: "isolation"
    collection: "electrons"
    dr: 0.4
  MuonIsolation:
    type: "isolation"
    collection: "muons"
    dr: 0.4

output:
  file_path: ""
  format: default
